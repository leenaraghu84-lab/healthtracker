<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — NutriVision AI</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0A0C10;
        color: #F0F4FF;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .wrap { max-width: 340px; }
      .badge {
        font-size: 11px;
        font-weight: 700;
        color: #00E5C8;
        letter-spacing: 2px;
        margin-bottom: 24px;
      }
      .ring {
        width: 84px;
        height: 84px;
        margin: 0 auto 24px;
        border-radius: 50%;
        border: 7px solid #1E2330;
        border-top-color: #00E5C8;
        animation: spin 2.4s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-size: 21px; font-weight: 800; margin: 0 0 10px; }
      p { font-size: 14px; color: #6B7A99; line-height: 1.6; margin: 0 0 12px; }
      button {
        margin-top: 20px;
        background: #00E5C8;
        color: #0A0C10;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 800;
        padding: 14px 32px;
        cursor: pointer;
      }
      .note {
        margin-top: 28px;
        font-size: 12px;
        color: #3A4259;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="badge">NUTRIVISION AI</div>
      <div class="ring"></div>
      <h1>You're offline</h1>
      <p>Your logged meals and progress are safe on this device.</p>
      <p>Photo and text analysis need a connection, since the nutrition estimates come from a server.</p>
      <button onclick="location.reload()">Try again</button>
      <div class="note">This page will reload automatically once you're back online.</div>
    </div>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
